<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tiffin Time Machine: an interactive lunchbox ritual of memories." />
    <title>Tiffin Time Machine</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23E8821E'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23FBF5E9'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="root"></div>
    <!-- TEMPORARY diagnostics: reveals load/runtime errors that would otherwise leave a white screen. -->
    <pre id="boot-diag" hidden style="white-space:pre-wrap;margin:2rem auto;max-width:720px;padding:24px;border:3px solid #2B2926;border-radius:16px;background:#FBF5E9;font:14px/1.5 system-ui,sans-serif"></pre>
    <noscript>Tiffin Time Machine needs JavaScript enabled.</noscript>
    <script>
      (function () {
        var errs = []
        function show(extra) {
          var d = document.getElementById('boot-diag')
          if (!d || window.__tiffinMounted) return
          if (extra) errs.push(extra)
          d.hidden = false
          d.textContent = 'Tiffin Time Machine could not start.\n\n' + errs.join('\n') + '\n\nURL: ' + location.href + '\nBrowser: ' + navigator.userAgent
        }
        window.addEventListener('error', function (e) {
          var t = e.target
          if (t && (t.src || t.href) && t !== window) errs.push('Failed to load: ' + (t.src || t.href))
          else errs.push((e.message || 'Script error') + (e.filename ? ' (' + e.filename + ':' + e.lineno + ')' : ''))
          show()
        }, true)
        window.addEventListener('unhandledrejection', function (e) { show('Unhandled promise rejection: ' + (e.reason && e.reason.message || e.reason)) })
        setTimeout(function () { if (!window.__tiffinMounted) show('The app did not mount within 4 seconds.') }, 4000)
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
